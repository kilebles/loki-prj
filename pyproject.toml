[project]
name = "loki-remake"
version = "0.1.0"
description = "LOKI Remake video-to-video pipeline on MiniMax-H3 / Viggle-Remake and GPUniq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "loguru>=0.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
]

[project.scripts]
loki-remake = "loki_remake.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loki_remake"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

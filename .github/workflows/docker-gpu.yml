name: Build GPU Worker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/docker-gpu.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-gpu-image:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on GitHub runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push portable GPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kilebles/loki-remake-gpu:latest
            ghcr.io/kilebles/loki-remake-gpu:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
